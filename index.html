<body>
<div class="app">
<header>自宅の整理整頓</header>
<main>
<section id="searchScreen" class="screen active">
  <div class="searchbox"><input id="searchInput" placeholder="物の名前を検索"><button class="btn" onclick="renderSearch()">検索</button></div>
  <div class="section-title">タグ</div><div id="tagChips" class="chips"></div>
  <div class="section-title">部屋</div><div id="roomChips" class="chips"></div>
  <div id="searchResults"></div>
</section>

<section id="placeScreen" class="screen"><div id="placeContent"></div></section>

<section id="addScreen" class="screen">
  <div class="section-title">物を追加</div>
  <div class="subtle">配置は「部屋 → 収納 → 棚・引き出し」の順に選択できます。タグはタップで複数選択でき、「＋ タグを追加」から新しいタグも登録できます。</div>
  <form id="itemForm" class="form">
    <label>品名 *</label><input id="itemName" required placeholder="例：ドライバーセット">
    <label>配置 *</label>
    <div id="locationLevels" class="location-levels"></div>
    <label>タグ</label><div id="addTagChips" class="chips"></div><input id="itemTags" type="hidden">
    <label>メモ</label><textarea id="itemMemo" placeholder="自由にメモ"></textarea>
    <label>写真</label><input id="itemPhoto" type="file" accept="image/*" capture="environment">
    <img id="photoPreview" class="photo-preview hidden">
    <div class="actions">
      <button class="btn" type="submit">登録する</button>
      <button class="btn secondary" type="button" onclick="registerAndContinueSameLocation()">この場所に続けて登録</button>
      <button class="btn secondary" type="button" onclick="resetItemForm()">クリア</button>
    </div>
  </form>
</section>

<section id="detailScreen" class="screen"></section>
</main>
<div id="modalOverlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
<nav class="bottom">
<button class="nav active" data-screen="searchScreen" onclick="showScreen('searchScreen')">🔍<small>探す</small></button>
<button class="nav" data-screen="placeScreen" onclick="showScreen('placeScreen');renderPlaces()">🏠<small>場所</small></button>
<button class="nav" data-screen="addScreen" onclick="showScreen('addScreen');populateAddLocation()">＋<small>追加</small></button>
</nav>
</div>


<div id="appToast" role="status" aria-live="polite"></div>
<script>
const KEY='homeOrganizerPhase1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 locations:[
  {id:'living',name:'リビング',parent:null,type:'room',photo:''},
  {id:'tv',name:'テレビ台',parent:'living',type:'storage',photo:''},
  {id:'tv-right',name:'右側引き出し',parent:'tv',type:'drawer',photo:''},
  {id:'tv-left',name:'左側引き出し',parent:'tv',type:'drawer',photo:''},
  {id:'bed',name:'寝室',parent:null,type:'room',photo:''},
  {id:'closet',name:'クローゼット',parent:'bed',type:'storage',photo:''},
  {id:'closet-upper',name:'上段',parent:'closet',type:'shelf',photo:''},
  {id:'kitchen',name:'キッチン',parent:null,type:'room',photo:''},
  {id:'cabinet',name:'食器棚',parent:'kitchen',type:'storage',photo:''},
  {id:'cabinet-drawer',name:'引き出し',parent:'cabinet',type:'drawer',photo:''}
 ],
 tags:['工具','DIY','電池','消耗品','書類','掃除用品','キッチン用品'],
 items:[
  {id:'sample1',name:'ドライバーセット',location:'tv-right',tags:['工具','DIY'],memo:'プラス・マイナス各2本',photo:''},
  {id:'sample2',name:'単4電池',location:'tv-left',tags:['電池','消耗品'],memo:'予備',photo:''}
 ]
};
data.locations.forEach(x=>{if(!x.photo)x.photo='';});
if(!Array.isArray(data.tags))data.tags=[];
let currentPlace=null,selectedTag='',selectedRoom='';
let addPath=[];
let editPath=[];

function normalizeLocationOrder(){
 const groups=new Map();
 data.locations.forEach(x=>{const key=x.parent===null?'__root__':x.parent;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)});
 groups.forEach(list=>{list.sort((a,b)=>(Number.isFinite(a.order)?a.order:0)-(Number.isFinite(b.order)?b.order:0));list.forEach((x,i)=>x.order=i)});
}
normalizeLocationOrder();
let toastTimer=null;
function showToast(message){
 const t=document.getElementById('appToast');
 if(!t)return;
 t.textContent=message;
 t.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
const PHOTO_DB='homeOrganizerPhotos';
const PHOTO_STORE='photos';
const photoCache=new Map();

function openPhotoDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(PHOTO_DB,1);
  req.onupgradeneeded=()=>req.result.createObjectStore(PHOTO_STORE);
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
async function putPhoto(dataUrl){
 const id='photo:'+crypto.randomUUID();
 const db=await openPhotoDB();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(PHOTO_STORE,'readwrite');
  tx.objectStore(PHOTO_STORE).put(dataUrl,id);
  tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
 });
 photoCache.set(id,dataUrl);
 return id;
}
async function getPhoto(id){
 if(!id)return '';
 if(!String(id).startsWith('photo:'))return id; // backward compatibility
 if(photoCache.has(id))return photoCache.get(id);
 const db=await openPhotoDB();
 const value=await new Promise((resolve,reject)=>{
  const tx=db.transaction(PHOTO_STORE,'readonly');
  const req=tx.objectStore(PHOTO_STORE).get(id);
  req.onsuccess=()=>resolve(req.result||'');
  req.onerror=()=>reject(req.error);
 });
 photoCache.set(id,value||'');
 return value||'';
}
function photoSrc(id){return photoCache.get(id)||''}
async function loadAllPhotos(){
 const refs=[...data.items,...data.locations].map(x=>x.photo).filter(Boolean);
 await Promise.all(refs.map(async ref=>{
  if(String(ref).startsWith('data:')){
   // Migrate old Base64 photos out of localStorage on first launch.
   try{
    const migrated=await putPhoto(ref);
    [...data.items,...data.locations].forEach(x=>{if(x.photo===ref)x.photo=migrated});
   }catch(e){console.warn('Photo migration failed',e)}
  }else if(String(ref).startsWith('photo:')){
   await getPhoto(ref);
  }
 }));
 save();
}
function save(){normalizeLocationOrder();localStorage.setItem(KEY,JSON.stringify(data))}

// Export a complete local backup, including photos stored separately in IndexedDB.
async function exportBackup(){
 try{
  const refs=[...data.items,...data.locations].map(x=>x.photo).filter(Boolean);
  const photos={};
  for(const ref of refs){
   if(String(ref).startsWith('data:'))photos[ref]=ref;
   else if(String(ref).startsWith('photo:')){
    const value=await getPhoto(ref);
    if(!value)throw new Error('写真データが見つかりません: '+ref);
    photos[ref]=value;
   }
  }
  const payload={format:'home-organizer-backup',version:1,exportedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data)),photos};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='home-organizer-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('バックアップを書き出しました。');
 }catch(e){
  console.error('Backup export failed',e);
  showToast('バックアップに失敗しました。写真の保存状態を確認してください。');
 }
}

async function restoreBackupFile(file){
 if(!file)return;
 try{
  const payload=JSON.parse(await file.text());
  if(!payload||payload.format!=='home-organizer-backup'||payload.version!==1||
     !payload.data||!Array.isArray(payload.data.locations)||!Array.isArray(payload.data.items)||!Array.isArray(payload.data.tags)||
     !payload.photos||typeof payload.photos!=='object'||Array.isArray(payload.photos)){
   throw new Error('対応していないバックアップ形式です。');
  }
  const restored=JSON.parse(JSON.stringify(payload.data));
  const photos=payload.photos;
  for(const collection of [restored.items,restored.locations]){
   for(const entry of collection){
    const ref=entry.photo;
    if(!ref)continue;
    if(String(ref).startsWith('photo:')&&!photos[ref])throw new Error('バックアップ内に写真データがありません。');
    if(String(ref).startsWith('data:')){
     const value=photos[ref]||ref;
     const newRef='photo:'+crypto.randomUUID();
     photos[newRef]=value;
     entry.photo=newRef;
    }
   }
  }
  for(const [id,value] of Object.entries(photos)){
   if(typeof value!=='string'||!value.startsWith('data:'))throw new Error('写真データの形式が正しくありません。');
  }
  if(!confirm('現在この端末に保存されているデータを、選択したバックアップの内容に置き換えます。復元前に現在のデータもバックアップしてください。続けますか？'))return;

  const db=await openPhotoDB();
  await new Promise((resolve,reject)=>{
   const tx=db.transaction(PHOTO_STORE,'readwrite');
   const store=tx.objectStore(PHOTO_STORE);
   for(const [id,value] of Object.entries(photos))store.put(value,id);
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error);
   tx.onabort=()=>reject(tx.error||new Error('写真データの復元に失敗しました。'));
  });
  data=restored;
  normalizeLocationOrder();
  localStorage.setItem(KEY,JSON.stringify(data));
  photoCache.clear();
  showToast('復元しました。アプリを再読み込みします。');
  location.reload();
 }catch(e){
  console.error('Backup restore failed',e);
  showToast('復元できませんでした。バックアップファイルを確認してください。');
 }
}

function loc(id){return data.locations.find(x=>x.id===id)}
function children(id){return data.locations.filter(x=>x.parent===id).sort((a,b)=>(a.order||0)-(b.order||0))}
function itemsAt(id){return data.items.filter(x=>x.location===id)}
function path(id){let a=[],x=loc(id);while(x){a.unshift(x.name);x=loc(x.parent)}return a.join(' → ')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return esc(s).replace(/`/g,'&#96;')}
function icon(t){return t==='room'?'🏠':t==='storage'?'🗄️':t==='drawer'?'▣':'▤'}

function showScreen(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));
 if(id==='searchScreen')renderSearch();
 if(id==='placeScreen')renderPlaces();
 if(id==='addScreen')renderAddForm(false);
}

function itemCard(i){
 const photo=photoSrc(i.photo)?`<img class="thumb" src="${photoSrc(i.photo)}">`:`<div class="thumb empty">📦</div>`;
 return `<div class="card item-card" onclick="showDetail('${i.id}')">${photo}<div class="item-info"><div class="item-name">${esc(i.name)}</div><div class="location">📍 ${esc(path(i.location))}</div><div class="tags">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="manage-actions search-item-actions"><button class="btn secondary" type="button" onclick="event.stopPropagation();editItem('${i.id}')">編集</button><button class="btn secondary" type="button" onclick="event.stopPropagation();deleteItem('${i.id}')">削除</button></div></div></div>`;
}
function renderSearch(){
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 const rooms=data.locations.filter(x=>x.type==='room');
 document.getElementById('tagChips').innerHTML=data.tags.map((t,i)=>`<button class="chip ${selectedTag===t?'active':''}" data-i="${i}">${esc(t)}</button>`).join('');
 document.querySelectorAll('#tagChips button[data-i]').forEach(b=>b.onclick=()=>{selectedTag=selectedTag===data.tags[+b.dataset.i]?'':data.tags[+b.dataset.i];renderSearch()});
 document.getElementById('roomChips').innerHTML=rooms.map(r=>`<button class="chip ${selectedRoom===r.id?'active':''}" data-room="${r.id}">${esc(r.name)}</button>`).join('');
 document.querySelectorAll('#roomChips button[data-room]').forEach(b=>b.onclick=()=>{selectedRoom=selectedRoom===b.dataset.room?'':b.dataset.room;renderSearch()});
 const results=data.items.filter(i=>{
  const text=!q||i.name.toLowerCase().includes(q);
  const tag=!selectedTag||(i.tags||[]).includes(selectedTag);
  const room=!selectedRoom||(i.location===selectedRoom||path(i.location).startsWith(loc(selectedRoom).name+' → '));
  return text&&tag&&room;
 });
 document.getElementById('searchResults').innerHTML=`<div class="section-title">検索結果 ${results.length}件</div>`+(results.length?results.map(itemCard).join(''):`<div class="empty-state">該当する物がありません</div>`);
}

let dragLocationId=null;
function startLocationDrag(e,id){if(placeMode!=='edit')return;dragLocationId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function allowLocationDrop(e){if(placeMode==='edit')e.preventDefault()}
function dropLocation(e,targetId){if(placeMode!=='edit')return;e.preventDefault();const sourceId=dragLocationId||e.dataTransfer.getData('text/plain');dragLocationId=null;if(!sourceId||sourceId===targetId)return;const source=loc(sourceId),target=loc(targetId);if(!source||!target||source.parent!==target.parent)return;const siblings=children(source.parent).filter(x=>x.id!==sourceId);const targetIndex=siblings.findIndex(x=>x.id===targetId);siblings.splice(targetIndex,0,source);siblings.forEach((x,i)=>x.order=i);save();renderPlaces()}
function endLocationDrag(e){e.currentTarget.classList.remove('dragging');dragLocationId=null}
function openPlace(id){placeMode='normal';currentPlace=id;renderPlaces()}

 </div></div>
 ${ch.length?`<div class="location-manage-list">${ch.map((x,i)=>modeLocationRow(x,i,false)).join('')}</div>`:`<div class="empty-state">まだ下の階層がありません</div>`}

let modalScrollY=0;

function syncModalViewport(){
 const overlay=document.getElementById('modalOverlay');
 if(!overlay)return;
 const vv=window.visualViewport;
 if(vv){
  overlay.style.height=vv.height+'px';
  overlay.style.top=vv.offsetTop+'px';
  overlay.style.bottom='auto';
 }
}

function lockPageForModal(){
 modalScrollY=window.scrollY;
 document.documentElement.classList.add('modal-open');
 document.body.classList.add('modal-open');
 syncModalViewport();
}

function unlockPageForModal(){
 document.documentElement.classList.remove('modal-open');
 document.body.classList.remove('modal-open');
 const y=modalScrollY;
 requestAnimationFrame(()=>window.scrollTo(0,y));
 const overlay=document.getElementById('modalOverlay');
 if(overlay){
  overlay.style.height='';
  overlay.style.top='';
  overlay.style.bottom='';
 }
}

function closeModal(){
 const overlay=document.getElementById('modalOverlay');
 if(overlay)overlay.classList.remove('show');
 const content=document.getElementById('modalContent');
 if(content)content.innerHTML='';
 unlockPageForModal();
}

async function saveLocationEditor(id){
 const p=loc(id),input=document.getElementById('locationEditName');
 const fileInput=document.getElementById('locationEditPhoto'),error=document.getElementById('locationEditError');
 const saveButton=document.getElementById('locationEditSave');
 if(!p||!input)return;
 const name=input.value.trim();
 if(!name){
  if(error)error.textContent='名称は空欄にできません。';
  input.focus({preventScroll:true});return;
 }
 if(saveButton){saveButton.disabled=true;saveButton.textContent='保存中…'}
 try{
  const file=fileInput?.files?.[0];
  let photoRef=p.photo||'';
  if(file){
   const dataUrl=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error||new Error('FileReader failed'));
    reader.readAsDataURL(file);
   });
   photoRef=await putPhoto(dataUrl);
  }
  p.name=name;p.photo=photoRef;
  save();closeModal();renderPlaces();showToast('場所を変更しました。');
 }catch(err){
  console.error(err);
  if(error)error.textContent='写真の保存に失敗しました。もう一度お試しください。';
  if(saveButton){saveButton.disabled=false;saveButton.textContent='保存'}
 }
}
function deleteCurrentPlace(){
 const p=loc(currentPlace);if(!p)return;

}
function deleteLocations(ids){
 const all=new Set(ids);let changed=true;
 while(changed){
  changed=false;
  data.locations.forEach(x=>{
   if(x.parent&&all.has(x.parent)&&!all.has(x.id)){all.add(x.id);changed=true}
  });
 }
 const itemCount=data.items.filter(i=>all.has(i.location)).length;
 const parent=loc(ids[0])?.parent||null;
 openAppConfirm('場所を削除','選択した'+ids.length+'件を削除しますか？\\n下位階層'+(all.size-ids.length)+'件、登録物'+itemCount+'件も削除対象になります。',()=>performDeleteLocations(ids,parent),'削除する');
}
function performDeleteLocations(ids,parent){
 const all=new Set(ids);let changed=true;
 while(changed){
  changed=false;
  data.locations.forEach(x=>{
   if(x.parent&&all.has(x.parent)&&!all.has(x.id)){all.add(x.id);changed=true}
  });
 }
 data.locations=data.locations.filter(x=>!all.has(x.id));
 data.items=data.items.filter(i=>!all.has(i.location));
 save();currentPlace=parent||null;renderPlaces();showToast('場所を削除しました。');
}

function setAddPathFromSelected(){
 addPath=[...document.querySelectorAll('#itemForm .dynamic-location-select')].map(s=>s.value).filter(Boolean);
}
function renderLocationLevels(){
 const form=document.getElementById('itemForm'),anchor=document.getElementById('itemTags');
 const old=Array.from(form.querySelectorAll('.dynamic-location-select,.location-choice-note'));
 old.forEach(x=>x.remove());
 // Preserve path values, but never allow skipping a parent.
 let parent=null,level=0;
 while(true){
  const candidates=children(parent); // Use the same saved order as the Places screen.
  if(!candidates.length)break;
  const sel=document.createElement('select');
  sel.className='location-select dynamic-location-select';
  sel.innerHTML=`<option value="">${level===0?'部屋を選択':'下の階層を選択（任意）'}</option>`+
   candidates.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  const value=addPath[level]&&candidates.some(x=>x.id===addPath[level])?addPath[level]:'';
  sel.value=value;
  sel.onchange=()=>{
   addPath=addPath.slice(0,level);
   if(sel.value)addPath.push(sel.value);
   renderLocationLevels();
  };
  form.insertBefore(sel,anchor);
  if(!value)break;
  parent=value;level++;
  if(level>50)break;
 }
 const note=document.createElement('div');note.className='subtle location-choice-note';
 note.textContent=addPath.length?'登録先：'+addPath.map(id=>loc(id)?.name).filter(Boolean).join(' → '):'配置を選択してください。下位階層がない場合は、選択した場所そのものに登録できます。';
 form.insertBefore(note,anchor);
}

  '</div>'+
  '<div class="modal-actions">'+
   '<button id="cancelTagButton" class="btn secondary" type="button">キャンセル</button>'+
   '<button id="submitTagButton" class="btn" type="button">追加する</button>'+
  '</div>';

 document.getElementById('cancelTagButton').onclick=closeModal;
 document.getElementById('submitTagButton').onclick=()=>{
  const input=document.getElementById('newTagName');
  const n=input?input.value.trim():'';
  if(!n){
   if(input)input.focus({preventScroll:true});
   return;
  }
  closeModal();
  onComplete(n);
 };

 lockPageForModal();
 overlay.classList.add('show');
 syncModalViewport();

 const input=document.getElementById('newTagName');
 if(input){
  requestAnimationFrame(()=>{
   try{input.focus({preventScroll:true})}catch(e){input.focus()}
   syncModalViewport();
  });
  input.onkeydown=e=>{
   if(e.key==='Enter'){
    e.preventDefault();
    document.getElementById('submitTagButton').click();
   }else if(e.key==='Escape'){
    e.preventDefault();
    closeModal();
   }
  };
 }
}

function addTag(){
 openAddTagModal(n=>{
  const t=n;
  if(!data.tags.includes(t))data.tags.push(t);
  let a=selectedAddTags();if(!a.includes(t))a.push(t);
  document.getElementById('itemTags').value=a.join('|');
  save();
  renderAddTags();
 });
}

function openTagManager(){
 const content=document.getElementById('modalContent'),overlay=document.getElementById('modalOverlay');
 if(!content||!overlay)return;
 const rows=data.tags.map(t=>{
  const count=data.items.filter(i=>(i.tags||[]).includes(t)).length;
  return '<div class="check-row tag-manage-row" draggable="true" data-tag="'+escAttr(t)+'" style="justify-content:space-between;gap:12px">'+
   '<span class="tag-drag-handle" aria-label="並び替え">⠿</span>'+
   '<span style="min-width:0;overflow-wrap:anywhere;flex:1">'+esc(t)+(count?' <span class="small">（'+count+'件で使用中）</span>':'')+'</span>'+
   '<div style="display:flex;gap:6px;flex:none">'+
    '<button type="button" class="btn secondary tag-edit-button" data-tag="'+escAttr(t)+'">編集</button>'+
    '<button type="button" class="btn secondary tag-delete-button" data-tag="'+escAttr(t)+'">削除</button>'+
   '</div>'+
  '</div>';
 }).join('');
 content.innerHTML=
  '<h3>タグを管理</h3>'+
  '<div class="subtle">不要なタグを削除できます。使用中のタグを削除すると、そのタグは登録済みの物からも外れます。</div>'+
  (rows||'<div class="subtle">登録されているタグはありません。</div>')+
  '<div class="modal-actions"><button id="tagManagerClose" class="btn secondary" type="button">閉じる</button></div>';
 document.getElementById('tagManagerClose').onclick=closeModal;
 let draggedTag=null;
 content.querySelectorAll('.tag-manage-row').forEach(row=>{
  row.addEventListener('dragstart',e=>{
   draggedTag=row.dataset.tag;
   e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTag);
   row.classList.add('dragging');
  });
  row.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});
  row.addEventListener('drop',e=>{
   e.preventDefault();
   const from=draggedTag||e.dataTransfer.getData('text/plain'),to=row.dataset.tag;
   draggedTag=null;
   if(!from||from===to)return;
   const list=[...data.tags],sourceIndex=list.indexOf(from),targetIndex=list.indexOf(to);
   if(sourceIndex<0||targetIndex<0)return;
   list.splice(sourceIndex,1);list.splice(targetIndex,0,from);
   data.tags=list;save();
   renderAddTags();
   renderSearch();
   openTagManager();
  });
  row.addEventListener('dragend',()=>{draggedTag=null;row.classList.remove('dragging')});
 });
 content.querySelectorAll('.tag-edit-button').forEach(btn=>{
  btn.onclick=()=>openTagEditor(btn.dataset.tag);
 });
 content.querySelectorAll('.tag-delete-button').forEach(btn=>{
  btn.onclick=()=>{
   const tag=btn.dataset.tag;
   const count=data.items.filter(i=>(i.tags||[]).includes(tag)).length;
   openAppConfirm(
    'タグを削除',
    '「'+tag+'」を削除しますか？'+(count?' このタグを使用している'+count+'件の物からも外れます。':''),
    ()=>deleteTag(tag),
    '削除する'
   );
  };
 });
 lockPageForModal();overlay.classList.add('show');syncModalViewport();
}
function openTagEditor(oldTag){
 if(!data.tags.includes(oldTag))return;
 const content=document.getElementById('modalContent'),overlay=document.getElementById('modalOverlay');
 if(!content||!overlay)return;
 content.innerHTML=
  '<h3>タグ名を編集</h3>'+
  '<div class="subtle">名称を修正すると、このタグを使用している登録済みの物にも反映されます。</div>'+
  '<div class="form"><label for="tagEditName">タグの名称</label>'+
  '<input id="tagEditName" type="text" value="'+escAttr(oldTag)+'" autocomplete="off">'+
  '<div id="tagEditError" class="small"></div></div>'+
  '<div class="modal-actions">'+
   '<button id="tagEditCancel" class="btn secondary" type="button">キャンセル</button>'+
   '<button id="tagEditSave" class="btn" type="button">保存</button>'+
  '</div>';
 document.getElementById('tagEditCancel').onclick=()=>openTagManager();
 document.getElementById('tagEditSave').onclick=()=>saveTagRename(oldTag);
 lockPageForModal();overlay.classList.add('show');syncModalViewport();
 const input=document.getElementById('tagEditName');
 if(input){
  requestAnimationFrame(()=>{
   try{input.focus({preventScroll:true})}catch(e){input.focus()}
   input.select();syncModalViewport();
  });
  input.onkeydown=e=>{
   if(e.key==='Enter'){e.preventDefault();saveTagRename(oldTag)}
   else if(e.key==='Escape'){e.preventDefault();openTagManager()}
  };
 }
}
function saveTagRename(oldTag){
 const input=document.getElementById('tagEditName');
 const error=document.getElementById('tagEditError');
 const saveButton=document.getElementById('tagEditSave');
 if(!input||!data.tags.includes(oldTag))return;
 const newTag=input.value.trim();
 if(!newTag){if(error)error.textContent='名称は空欄にできません。';input.focus({preventScroll:true});return}
 if(newTag!==oldTag&&data.tags.includes(newTag)){
  if(error)error.textContent='同じ名前のタグがすでにあります。別の名称を入力してください。';
  input.focus({preventScroll:true});input.select();return;
 }
 if(newTag===oldTag){openTagManager();return}
 if(saveButton){saveButton.disabled=true;saveButton.textContent='保存中…'}
 const index=data.tags.indexOf(oldTag);
 data.tags[index]=newTag;
 data.items.forEach(item=>{item.tags=(item.tags||[]).map(tag=>tag===oldTag?newTag:tag)});
 const addTags=document.getElementById('itemTags');
 if(addTags)addTags.value=(addTags.value||'').split('|').map(tag=>tag===oldTag?newTag:tag).join('|');
 const editTags=document.getElementById('editTags');
 if(editTags)editTags.value=(editTags.value||'').split('|').map(tag=>tag===oldTag?newTag:tag).join('|');
 save();
 closeModal();
 renderAddTags();
 if(document.getElementById('editTagChips'))renderEditTags();
 showToast('タグ名を変更しました。');
}
function deleteTag(tag){
 if(!data.tags.includes(tag))return;
 data.tags=data.tags.filter(t=>t!==tag);
 data.items.forEach(i=>{i.tags=(i.tags||[]).filter(t=>t!==tag)});
 const addTags=document.getElementById('itemTags');
 if(addTags)addTags.value=selectedAddTags().filter(t=>t!==tag).join('|');
 const editTags=document.getElementById('editTags');
 if(editTags)editTags.value=(editTags.value||'').split('|').filter(Boolean).filter(t=>t!==tag).join('|');
 save();
 closeModal();
 renderAddTags();
 if(document.getElementById('editTagChips'))renderEditTags();
 showToast('タグを削除しました。');
}
document.getElementById('itemPhoto').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const r=new FileReader();
  r.onload=async()=>{try{
   const ref=await putPhoto(r.result);
   const p=document.getElementById('photoPreview');
   p.src=r.result;p.classList.remove('hidden');p.dataset.value=ref;
  }catch(err){console.error(err);openAppMessage('写真の保存に失敗しました。','写真の保存に失敗しました。もう一度お試しください。')}};
  r.readAsDataURL(f);
 }catch(err){console.error(err);openAppMessage('写真の読み込みに失敗しました。','写真の読み込みに失敗しました。')}
});
document.getElementById('itemForm').addEventListener('submit',e=>{
 e.preventDefault();setAddPathFromSelected();
 const name=document.getElementById('itemName').value.trim(),location=chosenLocation();
 if(!name){openAppMessage('品名を入力してください。','品名を入力してから登録してください。');return}
 if(!location){openAppMessage('配置を選択してください。','部屋または配置を選択してから登録してください。');return}
 const p=document.getElementById('photoPreview');
 data.items.push({id:crypto.randomUUID(),name,location,tags:selectedAddTags(),memo:document.getElementById('itemMemo').value.trim(),photo:p.dataset.value||''});
 save();resetItemForm();showScreen('searchScreen');showToast('登録しました。');
});
function resetItemForm(){
 document.getElementById('itemForm').reset();document.getElementById('itemTags').value='';
 const p=document.getElementById('photoPreview');p.classList.add('hidden');p.removeAttribute('src');delete p.dataset.value;
 addPath=[];renderAddForm(false);
}

function registerAndContinueSameLocation(){
 setAddPathFromSelected();
 const name=document.getElementById('itemName').value.trim(),location=chosenLocation();
 if(!name){openAppMessage('品名を入力してください。','品名を入力してから登録してください。');return}
 if(!location){openAppMessage('配置を選択してください。','部屋または配置を選択してから登録してください。');return}

 // Keep only the selected location path; every other item field is reset.
 const keptLocationPath=[...addPath];
 const p=document.getElementById('photoPreview');
 data.items.push({
  id:crypto.randomUUID(),
  name,
  location,
  tags:selectedAddTags(),
  memo:document.getElementById('itemMemo').value.trim(),
  photo:p.dataset.value||''
 });
 save();

 document.getElementById('itemForm').reset();
 document.getElementById('itemTags').value='';
 p.classList.add('hidden');
 p.removeAttribute('src');
 delete p.dataset.value;

 addPath=keptLocationPath;
 renderAddForm(false);
 showToast('登録しました。同じ場所に続けて登録できます。');

 const input=document.getElementById('itemName');
 if(input)requestAnimationFrame(()=>{try{input.focus({preventScroll:true})}catch(e){input.focus()}});
}


function showDetail(id){
 const i=data.items.find(x=>x.id===id);if(!i)return;
 document.getElementById('detailScreen').innerHTML=`<button class="back" onclick="showScreen('searchScreen')">← 検索に戻る</button>${photoSrc(i.photo)?`<img class="detail-photo" src="${photoSrc(i.photo)}">`:''}<div class="detail-title">${esc(i.name)}</div><div class="location">📍 ${esc(path(i.location))}</div><div class="tags">${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${i.memo?`<div class="card">${esc(i.memo)}</div>`:''}<div class="actions"><button class="btn" onclick="editItem('${i.id}')">編集</button><button class="btn secondary" onclick="deleteItem('${i.id}')">削除</button></div>`;
 showScreen('detailScreen');
}
function editItem(id){
 const i=data.items.find(x=>x.id===id);if(!i)return;
 document.getElementById('detailScreen').innerHTML=`<button class="back" onclick="showScreen('searchScreen')">← 検索に戻る</button><div class="section-title">物を編集</div><div class="editor form"><label>品名 *</label><input id="editName" value="${escAttr(i.name)}"><label>配置</label><div id="editLocationArea"></div><label>タグ</label><div id="editTagChips" class="chips"></div><input id="editTags" type="hidden" value="${escAttr((i.tags||[]).join('|'))}"><label>メモ</label><textarea id="editMemo">${esc(i.memo||'')}</textarea><label>写真</label><input id="editPhoto" type="file" accept="image/*" capture="environment"><img id="editPhotoPreview" class="photo-preview ${photoSrc(i.photo)?'':'hidden'}" ${photoSrc(i.photo)?`src="${photoSrc(i.photo)}"`:''} data-ref="${escAttr(i.photo||'')}"><div class="actions"><button class="btn" onclick="saveItemEdit('${i.id}')">保存</button><button class="btn secondary" onclick="showScreen('searchScreen')">キャンセル</button></div></div>`;
 renderEditLocation(i.location);renderEditTags();
 document.getElementById('editPhoto').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{try{
  const ref=await putPhoto(r.result);
  const p=document.getElementById('editPhotoPreview');p.src=r.result;p.classList.remove('hidden');p.dataset.value=ref;p.dataset.ref=ref;
 }catch(err){console.error(err);openAppMessage('写真の保存に失敗しました。','写真の保存に失敗しました。もう一度お試しください。')}};
 r.readAsDataURL(f);
};
 showScreen('detailScreen');
}
function renderEditLocation(location){
 let chain=[],x=loc(location);while(x){chain.unshift(x.id);x=loc(x.parent)}editPath=chain;
 const area=document.getElementById('editLocationArea');area.innerHTML='';let parent=null;
 editPath.forEach((id,level)=>{
  const sel=document.createElement('select');sel.className='location-select';sel.innerHTML=data.locations.filter(x=>x.parent===parent).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');sel.value=id;
  sel.onchange=()=>{editPath=editPath.slice(0,level);if(sel.value)editPath.push(sel.value);renderEditLocation(editPath.at(-1))};
  area.appendChild(sel);parent=id;
 });
 const next=children(editPath.at(-1)||'');
 if(next.length){const sel=document.createElement('select');sel.className='location-select';sel.innerHTML='<option value="">さらに下の階層（任意）</option>'+next.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');sel.onchange=()=>{if(sel.value){editPath.push(sel.value);renderEditLocation(sel.value)}};area.appendChild(sel)}
}
function renderEditTags(){
 const el=document.getElementById('editTagChips'),selected=(document.getElementById('editTags').value||'').split('|').filter(Boolean);
 el.innerHTML=data.tags.map((t,i)=>`<button type="button" class="chip ${selected.includes(t)?'active':''}" data-i="${i}">${esc(t)}</button>`).join('')+
  `<button type="button" class="chip" id="editNewTag">＋ タグを追加</button>`+
  `<button type="button" class="chip" id="editManageTag">⚙ タグを管理</button>`;
 el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>toggleEditTag(data.tags[+b.dataset.i]));
 document.getElementById('editNewTag').onclick=()=>openAddTagModal(n=>{
  const t=n;
  if(!data.tags.includes(t))data.tags.push(t);
  toggleEditTag(t);
  save();
  renderEditTags();
 });
 document.getElementById('editManageTag').onclick=openTagManager;
}
function toggleEditTag(t){let a=(document.getElementById('editTags').value||'').split('|').filter(Boolean);a=a.includes(t)?a.filter(x=>x!==t):[...a,t];document.getElementById('editTags').value=a.join('|');renderEditTags()}
function saveItemEdit(id){
 const i=data.items.find(x=>x.id===id),name=document.getElementById('editName').value.trim(),location=editPath.at(-1);
 if(!name||!location){openAppMessage('入力を確認してください。','品名と配置を確認してください。');return}
 i.name=name;i.location=location;i.tags=document.getElementById('editTags').value.split('|').filter(Boolean);i.memo=document.getElementById('editMemo').value.trim();
 const preview=document.getElementById('editPhotoPreview');
 if(preview.dataset.value)i.photo=preview.dataset.value;
 else if(preview.dataset.ref)i.photo=preview.dataset.ref;
 save();showScreen('searchScreen');showToast('変更しました。');
}
function deleteItem(id){
 const i=data.items.find(x=>x.id===id);if(!i)return;
 openAppConfirm('物を削除','「'+i.name+'」を削除しますか？',()=>{
  data.items=data.items.filter(x=>x.id!==id);save();showScreen('searchScreen');showToast('削除しました。');
 },'削除する');
}

document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{
 // Do not reset add form; values are stored in DOM.
}));
(async()=>{
 await loadAllPhotos();
 renderSearch();
 renderAddForm(false);
 renderPlaces();
})();

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
